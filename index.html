<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PULSO·CAFÉ — Salud operativa para cafeterías</title>
<meta name="description" content="Mide el estado de salud de tu cafetería, gana insignias y conecta con baristas especializados cerca de ti." />

<!-- PWA: manifest y color de tema -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="background-color" content="#EFEDE7" />

<!-- Íconos -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- iOS: soporte para instalar como app de pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PULSO·CAFÉ" />

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes" />

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #E9E7E1; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const INK = "#0A0A0A";
const PAPER = "#FFFFFF";
const BONE = "#EFEDE7";
const GRAY_D = "#57554E";

const AREAS = [
  { id: "equipo", nombre: "Equipamiento", peso: 0.25, puntaje: 74 },
  { id: "higiene", nombre: "Higiene y sanidad", peso: 0.25, puntaje: 91 },
  { id: "personal", nombre: "Personal", peso: 0.20, puntaje: 68 },
  { id: "finanzas", nombre: "Finanzas", peso: 0.15, puntaje: 80 },
  { id: "cliente", nombre: "Cliente", peso: 0.15, puntaje: 76 },
];

function estadoDe(p) {
  if (p >= 85) return "ÓPTIMO";
  if (p >= 60) return "BUENO";
  return "BAJO";
}

const INSIGNIAS = [
  { id: 1, nombre: "Higiene impecable", desc: "90+ en sanidad, 3 meses seguidos", obtenida: true },
  { id: 2, nombre: "Equipo certificado", desc: "Mantenimiento al día en toda la barra", obtenida: true },
  { id: 3, nombre: "Cero incidentes", desc: "180 días sin alertas de reparación", obtenida: true },
  { id: 4, nombre: "Barista certificado", desc: "Curso SCA completado por el equipo", obtenida: false },
  { id: 5, nombre: "Cliente fiel", desc: "80+ en recompra durante un trimestre", obtenida: false },
  { id: 6, nombre: "Mentor del barrio", desc: "Recomienda a 3 cafeterías vecinas", obtenida: false },
];

const BARISTAS = [
  { id: 1, nombre: "Emilio Duarte", especialidad: "Reparación de espresso", distancia: "0.6 km", disponible: true, x: 62, y: 38 },
  { id: 2, nombre: "Renata Cobos", especialidad: "Curso de latte art", distancia: "1.1 km", disponible: true, x: 30, y: 58 },
  { id: 3, nombre: "Iván Salcedo", especialidad: "Normativa sanitaria", distancia: "1.4 km", disponible: false, x: 74, y: 68 },
  { id: 4, nombre: "Dana Uribe", especialidad: "Asesoría financiera", distancia: "2.0 km", disponible: true, x: 45, y: 22 },
];

const TABS = [
  { id: "estado", n: "01", titulo: "Estado" },
  { id: "insignias", n: "02", titulo: "Insignias" },
  { id: "baristas", n: "03", titulo: "Baristas" },
];

function Dial({ valor }) {
  const cx = 140, cy = 140, r = 108;
  const startAngle = -225, sweep = 270;
  const angleFor = (v) => startAngle + (v / 100) * sweep;
  const toXY = (deg) => {
    const rad = (deg * Math.PI) / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const ticks = [];
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 25 === 0;
    const deg = angleFor(v);
    const [x1, y1] = toXY(deg);
    const inner = r - (major ? 16 : 8);
    const rad = (deg * Math.PI) / 180;
    const x2 = cx + inner * Math.cos(rad);
    const y2 = cy + inner * Math.sin(rad);
    ticks.push(
      <line key={v} x1={x1} y1={y1} x2={x2} y2={y2} stroke={INK} strokeWidth={major ? 2 : 1} opacity={major ? 1 : 0.35} />
    );
  }
  const needleDeg = angleFor(valor);
  const needleRad = (needleDeg * Math.PI) / 180;
  const nx = cx + (r - 26) * Math.cos(needleRad);
  const ny = cy + (r - 26) * Math.sin(needleRad);

  const arcPath = (from, to, radius) => {
    const [x1, y1] = toXY(from);
    const [x2, y2] = toXY(to);
    const large = to - from > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2}`;
  };

  return (
    <svg width="280" height="240" viewBox="0 0 280 220">
      <path d={arcPath(startAngle, startAngle + sweep, r)} fill="none" stroke={INK} strokeWidth="1.5" opacity="0.5" />
      {ticks}
      <path d={arcPath(startAngle, needleDeg, r)} fill="none" stroke={INK} strokeWidth="4" />
      <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={INK} strokeWidth="2" />
      <circle cx={cx} cy={cy} r="4" fill={INK} />
      <text x={cx} y={cy + 42} textAnchor="middle" fontFamily="Archivo" fontWeight="900" fontSize="46" fill={INK}>
        {Math.round(valor)}
      </text>
      <text x={cx} y={cy + 62} textAnchor="middle" fontFamily="Space Mono" fontSize="11" letterSpacing="2" fill={GRAY_D}>
        SOBRE 100
      </text>
    </svg>
  );
}

function BarraArea({ area }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "Space Mono", fontSize: 11, letterSpacing: 0.5, color: INK, marginBottom: 6 }}>
        <span>{area.nombre.toUpperCase()}</span>
        <span>{area.puntaje}/100 · P{Math.round(area.peso * 100)}</span>
      </div>
      <div style={{ height: 6, background: "#DAD7CE", position: "relative" }}>
        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${area.puntaje}%`, background: INK }} />
      </div>
    </div>
  );
}

function PantallaEstado({ saludTotal, mostrarFormula, setMostrarFormula }) {
  const estado = estadoDe(saludTotal);
  return (
    <div>
      <div style={S.eyebrow}>REGISTRO Nº 0192 — GUADALAJARA, JAL.</div>
      <h1 style={S.h1}>Café Alameda</h1>
      <div style={S.metaRow}>REGISTRADO 12·03·2026</div>

      <div style={S.dialWrap}>
        <Dial valor={saludTotal} />
        <div style={{ ...S.estadoTag, borderColor: INK }}>{estado}</div>
      </div>

      <div style={S.legend}>
        <div style={S.legendRow}><span>85–100</span><span>ÓPTIMO</span></div>
        <div style={S.legendRow}><span>60–84</span><span>BUENO</span></div>
        <div style={S.legendRow}><span>0–59</span><span>BAJO</span></div>
      </div>

      <button style={S.enlaceFormula} onClick={() => setMostrarFormula(!mostrarFormula)}>
        {mostrarFormula ? "— ocultar el cálculo" : "+ cómo se calcula este número"}
      </button>
      {mostrarFormula && (
        <div style={S.cajaFormula}>
          <div style={{ fontFamily: "Space Mono", fontSize: 11, color: GRAY_D, marginBottom: 10 }}>
            SALUD = Σ (PUNTAJE DE ÁREA × PESO)
          </div>
          {AREAS.map((a) => (
            <div key={a.id} style={S.filaFormula}>
              <span>{a.nombre}</span>
              <span>{a.puntaje} × {Math.round(a.peso * 100)}% = {(a.puntaje * a.peso).toFixed(1)}</span>
            </div>
          ))}
          <div style={{ ...S.filaFormula, borderTop: `1px solid ${INK}`, paddingTop: 8, fontWeight: 700 }}>
            <span>TOTAL</span>
            <span>{saludTotal.toFixed(1)}</span>
          </div>
        </div>
      )}

      <div style={S.h2}>Desglose por área</div>
      {AREAS.map((a) => <BarraArea key={a.id} area={a} />)}
    </div>
  );
}

function PantallaInsignias() {
  const obtenidas = INSIGNIAS.filter((i) => i.obtenida).length;
  return (
    <div>
      <div style={S.eyebrow}>{obtenidas} DE {INSIGNIAS.length} OBTENIDAS</div>
      <h1 style={S.h1}>Insignias</h1>
      <p style={S.parrafo}>Se otorgan automáticamente cuando un área se mantiene estable por un periodo. Son un registro, no una calificación.</p>
      <div style={{ marginTop: 20 }}>
        {INSIGNIAS.map((ins) => (
          <div key={ins.id} style={{ ...S.filaInsignia, opacity: ins.obtenida ? 1 : 0.4 }}>
            <div style={S.iconoInsignia}>
              {ins.obtenida ? (
                <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 12 L10 18 L20 6" stroke={INK} strokeWidth="2.5" fill="none" strokeLinecap="square"/></svg>
              ) : (
                <svg width="22" height="22" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" fill="none" stroke={INK} strokeWidth="2"/><path d="M8 10 V7 a4 4 0 0 1 8 0 v3" fill="none" stroke={INK} strokeWidth="2"/></svg>
              )}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{ins.nombre}</div>
              <div style={{ fontFamily: "Space Mono", fontSize: 11, color: GRAY_D, marginTop: 3, letterSpacing: 0.3 }}>{ins.desc.toUpperCase()}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function MapaAbstracto({ baristas, activo, setActivo }) {
  return (
    <svg width="100%" height="220" viewBox="0 0 320 220" style={{ background: BONE, border: `1px solid ${INK}` }}>
      {[40, 90, 140, 190, 240, 290].map((x) => <line key={"v"+x} x1={x} y1="0" x2={x} y2="220" stroke={INK} strokeWidth="0.5" opacity="0.25" />)}
      {[35, 75, 115, 155, 195].map((y) => <line key={"h"+y} x1="0" y1={y} x2="320" y2={y} stroke={INK} strokeWidth="0.5" opacity="0.25" />)}
      <circle cx="160" cy="110" r="5" fill={INK} />
      <circle cx="160" cy="110" r="10" fill="none" stroke={INK} strokeWidth="1" />
      <text x="160" y="130" textAnchor="middle" fontFamily="Space Mono" fontSize="9" letterSpacing="1" fill={GRAY_D}>TÚ ESTÁS AQUÍ</text>
      {baristas.map((b, idx) => {
        const x = 20 + (b.x / 100) * 280;
        const y = 15 + (b.y / 100) * 190;
        const sel = activo === b.id;
        return (
          <g key={b.id} onClick={() => setActivo(b.id)} style={{ cursor: "pointer" }}>
            <circle cx={x} cy={y} r={sel ? 12 : 9} fill={sel ? INK : PAPER} stroke={INK} strokeWidth="2" />
            <text x={x} y={y + 4} textAnchor="middle" fontFamily="Space Mono" fontWeight="700" fontSize="10" fill={sel ? PAPER : INK}>{idx + 1}</text>
          </g>
        );
      })}
    </svg>
  );
}

function PantallaBaristas() {
  const [activo, setActivo] = useState(BARISTAS[0].id);
  return (
    <div>
      <div style={S.eyebrow}>{BARISTAS.filter(b=>b.disponible).length} DISPONIBLES CERCA DE TI</div>
      <h1 style={S.h1}>Baristas</h1>
      <p style={S.parrafo}>Profesionales verificados en tu zona que pueden resolver una alerta en persona.</p>
      <MapaAbstracto baristas={BARISTAS} activo={activo} setActivo={setActivo} />
      <div style={{ marginTop: 18 }}>
        {BARISTAS.map((b, idx) => (
          <div
            key={b.id}
            onClick={() => setActivo(b.id)}
            style={{ ...S.filaBarista, borderColor: activo === b.id ? INK : "#D8D5CB" }}
          >
            <div style={S.numeroBarista}>{idx + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{b.nombre}</div>
              <div style={{ fontSize: 13, color: GRAY_D, marginTop: 2 }}>{b.especialidad}</div>
              <div style={{ fontFamily: "Space Mono", fontSize: 11, color: GRAY_D, marginTop: 4, letterSpacing: 0.4 }}>
                {b.distancia.toUpperCase()} · {b.disponible ? "DISPONIBLE" : "OCUPADO"}
              </div>
            </div>
            <button style={{ ...S.botonContactar, opacity: b.disponible ? 1 : 0.35 }} disabled={!b.disponible}>
              Contactar
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("estado");
  const [mostrarFormula, setMostrarFormula] = useState(false);
  const saludTotal = useMemo(() => AREAS.reduce((s, a) => s + a.puntaje * a.peso, 0), []);

  return (
    <div style={S.escenario}>
      <div style={S.telefono}>
        <div style={S.notch} />
        <div style={S.barraEstado}>
          <span>9:41</span>
          <span style={{ display: "flex", gap: 5, alignItems: "center" }}>
            <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="7" width="3" height="4" fill={INK}/><rect x="4.5" y="5" width="3" height="6" fill={INK}/><rect x="9" y="2.5" width="3" height="8.5" fill={INK}/><rect x="13.5" y="0" width="2.5" height="11" fill={INK}/></svg>
            <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0.5" y="0.5" width="15" height="10" rx="2" fill="none" stroke={INK}/><rect x="16.3" y="3.5" width="1.3" height="4" fill={INK}/><rect x="2" y="2" width="11" height="7" fill={INK}/></svg>
          </span>
        </div>

        <div style={S.marcaApp}>
          <div style={S.marcaTexto}>PULSO·CAFÉ</div>
          <div style={S.marcaSub}>SALUD OPERATIVA — CAFETERÍAS INDEPENDIENTES</div>
        </div>

        <div style={S.contenido}>
          {tab === "estado" && <PantallaEstado saludTotal={saludTotal} mostrarFormula={mostrarFormula} setMostrarFormula={setMostrarFormula} />}
          {tab === "insignias" && <PantallaInsignias />}
          {tab === "baristas" && <PantallaBaristas />}
        </div>

        <div style={S.tabBar}>
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.tabBtn, opacity: tab === t.id ? 1 : 0.4 }}>
              <div style={S.tabNum}>{t.n}</div>
              <div style={S.tabTitulo}>{t.titulo}</div>
              {tab === t.id && <div style={S.tabIndicador} />}
            </button>
          ))}
        </div>
        <div style={S.homeIndicator} />
      </div>
      <div style={S.notaPie}>Vista previa · dimensiones de referencia iPhone / Android</div>
    </div>
  );
}

const S = {
  escenario: { minHeight: "100vh", background: BONE, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "28px 12px", fontFamily: "Inter, sans-serif" },
  telefono: { width: 375, maxWidth: "100%", height: 812, maxHeight: "88vh", background: PAPER, border: `2px solid ${INK}`, position: "relative", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "10px 10px 0 rgba(10,10,10,0.9)" },
  notch: { position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 120, height: 22, background: INK, borderRadius: "0 0 14px 14px", zIndex: 5 },
  barraEstado: { display: "flex", justifyContent: "space-between", padding: "10px 22px 4px", fontFamily: "Space Mono", fontSize: 12, color: INK, fontWeight: 700 },
  marcaApp: { padding: "10px 22px 14px", borderBottom: `1px solid ${INK}` },
  marcaTexto: { fontFamily: "Archivo", fontWeight: 900, fontSize: 20, letterSpacing: 0.5 },
  marcaSub: { fontFamily: "Space Mono", fontSize: 9, letterSpacing: 1, color: GRAY_D, marginTop: 3 },
  contenido: { flex: 1, overflowY: "auto", padding: "20px 22px 10px" },
  eyebrow: { fontFamily: "Space Mono", fontSize: 10, letterSpacing: 1.2, color: GRAY_D, marginBottom: 6 },
  h1: { fontFamily: "Archivo", fontWeight: 900, fontSize: 30, margin: "0 0 4px", letterSpacing: -0.5 },
  h2: { fontFamily: "Archivo", fontWeight: 700, fontSize: 16, margin: "26px 0 14px" },
  metaRow: { fontFamily: "Space Mono", fontSize: 10, color: GRAY_D, letterSpacing: 0.5, marginBottom: 14 },
  parrafo: { fontSize: 14, color: GRAY_D, lineHeight: 1.55, margin: "0 0 4px" },
  dialWrap: { display: "flex", flexDirection: "column", alignItems: "center", margin: "10px 0 6px", position: "relative" },
  estadoTag: { fontFamily: "Space Mono", fontWeight: 700, fontSize: 12, letterSpacing: 2, border: "1.5px solid " + INK, padding: "5px 14px", marginTop: -8 },
  legend: { display: "flex", justifyContent: "center", gap: 18, margin: "18px 0 6px" },
  legendRow: { display: "flex", flexDirection: "column", alignItems: "center", fontFamily: "Space Mono", fontSize: 10, color: GRAY_D, gap: 3 },
  enlaceFormula: { background: "none", border: "none", padding: 0, marginTop: 16, fontFamily: "Space Mono", fontSize: 11, letterSpacing: 0.5, color: INK, cursor: "pointer", textDecoration: "underline" },
  cajaFormula: { border: "1px solid " + INK, padding: 14, marginTop: 12 },
  filaFormula: { display: "flex", justifyContent: "space-between", fontFamily: "Space Mono", fontSize: 11, padding: "4px 0", color: GRAY_D },
  filaInsignia: { display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: "1px solid #D8D5CB" },
  iconoInsignia: { width: 40, height: 40, border: "1.5px solid " + INK, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 },
  filaBarista: { display: "flex", alignItems: "center", gap: 12, padding: 12, border: "1.5px solid", marginBottom: 10, transition: "border-color .15s" },
  numeroBarista: { width: 26, height: 26, border: "1.5px solid " + INK, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Space Mono", fontWeight: 700, fontSize: 12, flexShrink: 0 },
  botonContactar: { background: INK, color: PAPER, border: "none", padding: "9px 14px", fontFamily: "Space Mono", fontSize: 11, letterSpacing: 0.5, cursor: "pointer" },
  tabBar: { display: "flex", borderTop: "1px solid " + INK, padding: "10px 10px 4px" },
  tabBtn: { flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "4px 0 10px", cursor: "pointer", position: "relative", fontFamily: "inherit" },
  tabNum: { fontFamily: "Space Mono", fontSize: 9, color: INK },
  tabTitulo: { fontFamily: "Archivo", fontWeight: 700, fontSize: 12, color: INK },
  tabIndicador: { position: "absolute", bottom: 0, width: 26, height: 2, background: INK },
  homeIndicator: { position: "absolute", bottom: 6, left: "50%", transform: "translateX(-50%)", width: 120, height: 4, borderRadius: 3, background: INK },
  notaPie: { fontFamily: "Space Mono", fontSize: 10, color: GRAY_D, marginTop: 14, letterSpacing: 0.5 },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  // Registro del service worker para uso offline e instalación como PWA
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("No se pudo registrar el service worker:", err);
      });
    });
  }
</script>
</body>
</html>
