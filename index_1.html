function Dial({ valor }) {
  const cx = 140, cy = 140, r = 108;
  const startAngle = -225, sweep = 270;
  const angleFor = (v) => startAngle + (v / 100) * sweep;
  const toXY = (deg) => {
    const rad = (deg * Math.PI) / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const ticks = [];
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 25 === 0;
    const deg = angleFor(v);
    const [x1, y1] = toXY(deg);
    const inner = r - (major ? 16 : 8);
    const rad = (deg * Math.PI) / 180;
    const x2 = cx + inner * Math.cos(rad);
    const y2 = cy + inner * Math.sin(rad);
    ticks.push(
      <line key={v} x1={x1} y1={y1} x2={x2} y2={y2} stroke={INK} strokeWidth={major ? 2 : 1} opacity={major ? 1 : 0.35} />
    );
  }
  const needleDeg = angleFor(valor);
  const needleRad = (needleDeg * Math.PI) / 180;
  const nx = cx + (r - 26) * Math.cos(needleRad);
  const ny = cy + (r - 26) * Math.sin(needleRad);

  const arcPath = (from, to, radius) => {
    const [x1, y1] = toXY(from);
    const [x2, y2] = toXY(to);
    const large = to - from > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2}`;
  };

  return (
    <svg width="280" height="240" viewBox="0 0 280 220">
      <path d={arcPath(startAngle, startAngle + sweep, r)} fill="none" stroke={INK} strokeWidth="1.5" opacity="0.5" />
      {ticks}
      <path d={arcPath(startAngle, needleDeg, r)} fill="none" stroke={INK} strokeWidth="4" />
      <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={INK} strokeWidth="2" />
      <circle cx={cx} cy={cy} r="4" fill={INK} />
      <text x={cx} y={cy + 42} textAnchor="middle" fontFamily="Archivo" fontWeight="900" fontSize="46" fill={INK}>
        {Math.round(valor)}
      </text>
      <text x={cx} y={cy + 62} textAnchor="middle" fontFamily="Space Mono" fontSize="11" letterSpacing="2" fill={GRAY_D}>
        SOBRE 100
      </text>
    </svg>
  );
}

            </div>
            <div style={{ fontWeight: 700, fontSize: 16, marginTop: 8 }}>{f.nombre}</div>
            <div style={{ fontSize: 13, color: GRAY_D, marginTop: 4, lineHeight: 1.5 }}>{f.desc}</div>
            <div style={{ fontFamily: "Space Mono", fontSize: 12, fontWeight: 700, marginTop: 12, letterSpacing: 0.5 }}>{f.tarifa}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AppCafeteria() {
  const [tab, setTab] = useState("estado");
  const [mostrarFormula, setMostrarFormula] = useState(false);
  const saludTotal = useMemo(() => AREAS.reduce((s, a) => s + a.puntaje * a.peso, 0), []);
  return (
    <React.Fragment>
      <div style={S.contenido}>
        {tab === "estado" && <PantallaEstado saludTotal={saludTotal} mostrarFormula={mostrarFormula} setMostrarFormula={setMostrarFormula} />}
        {tab === "insignias" && <PantallaInsignias />}
        {tab === "baristas" && <PantallaBaristas />}
      </div>
      <div style={S.tabBar}>
        {TABS.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.tabBtn, opacity: tab === t.id ? 1 : 0.4 }}>
            <div style={S.tabNum}>{t.n}</div>
            <div style={S.tabTitulo}>{t.titulo}</div>
            {tab === t.id && <div style={S.tabIndicador} />}
          </button>
        ))}
      </div>
    </React.Fragment>
  );
}

const ESPECIALIDADES_OPCIONES = ["Espresso", "Latte art", "Tueste", "Catación", "Gestión de barra", "Atención al cliente"];
const DIAS_OPCIONES = ["L", "M", "M", "J", "V", "S", "D"];

function CampoTexto({ etiqueta, valor, onChange, placeholder, tipo }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={S.labelCampo}>{etiqueta}</div>
      <input
        type={tipo || "text"}
        value={valor}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        style={S.inputCampo}
      />
    </div>
  );
}

function PantallaRegistroBarista({ onRegistrado }) {
  const [nombre, setNombre] = useState("");
  const [ciudad, setCiudad] = useState("");
  const [anios, setAnios] = useState("");
  const [especialidades, setEspecialidades] = useState([]);
  const [certificaciones, setCertificaciones] = useState("");
  const [cafeteria, setCafeteria] = useState("");
  const [telefono, setTelefono] = useState("");
  const [correo, setCorreo] = useState("");
  const [tarifa, setTarifa] = useState("");
  const [dias, setDias] = useState([]);
  const [acepta, setAcepta] = useState(false);

  const toggleEsp = (e) =>
    setEspecialidades((prev) => (prev.includes(e) ? prev.filter((x) => x !== e) : [...prev, e]));
  const toggleDia = (idx) =>
    setDias((prev) => (prev.includes(idx) ? prev.filter((x) => x !== idx) : [...prev, idx]));

  const completo = nombre && ciudad && telefono && acepta;

  return (
    <div>
      <div style={S.eyebrow}>PASO 1 DE 1</div>
      <h1 style={S.h1}>Registro de barista</h1>
      <p style={S.parrafo}>Esta información te hace visible para las cafeterías de tu zona y define tu perfil dentro de la red.</p>

      <div style={S.h2}>Datos personales</div>
      <CampoTexto etiqueta="NOMBRE COMPLETO" valor={nombre} onChange={setNombre} placeholder="Ej. Renata Cobos" />
      <CampoTexto etiqueta="CIUDAD / ZONA" valor={ciudad} onChange={setCiudad} placeholder="Ej. Guadalajara, Jal." />
      <CampoTexto etiqueta="TELÉFONO / WHATSAPP" valor={telefono} onChange={setTelefono} placeholder="Ej. 33 1234 5678" tipo="tel" />
      <CampoTexto etiqueta="CORREO ELECTRÓNICO" valor={correo} onChange={setCorreo} placeholder="Ej. renata@correo.com" tipo="email" />

      <div style={S.h2}>Experiencia</div>
      <CampoTexto etiqueta="AÑOS EN CAFÉ DE ESPECIALIDAD" valor={anios} onChange={setAnios} placeholder="Ej. 4" tipo="number" />
      <CampoTexto etiqueta="CAFETERÍA ACTUAL O MÁS RECIENTE" valor={cafeteria} onChange={setCafeteria} placeholder="Opcional" />
      <CampoTexto etiqueta="CERTIFICACIONES PREVIAS" valor={certificaciones} onChange={setCertificaciones} placeholder="Ej. SCA Barista Skills, o ninguna" />

      <div style={S.labelCampo}>ESPECIALIDADES</div>
      <div style={S.chipsWrap}>
        {ESPECIALIDADES_OPCIONES.map((e) => (
          <button key={e} onClick={() => toggleEsp(e)} style={{ ...S.chip, ...(especialidades.includes(e) ? S.chipActivo : {}) }}>
            {e}
          </button>
        ))}
      </div>

      <div style={S.h2}>Disponibilidad y tarifa</div>
      <div style={S.labelCampo}>DÍAS DISPONIBLES</div>
      <div style={S.chipsWrap}>
        {DIAS_OPCIONES.map((d, idx) => (
          <button key={idx} onClick={() => toggleDia(idx)} style={{ ...S.chipDia, ...(dias.includes(idx) ? S.chipActivo : {}) }}>
            {d}
          </button>
        ))}
      </div>
      <CampoTexto etiqueta="TARIFA POR SESIÓN (MXN)" valor={tarifa} onChange={setTarifa} placeholder="Ej. 450" tipo="number" />

      <div style={S.filaCheckbox} onClick={() => setAcepta(!acepta)}>
        <div style={{ ...S.checkbox, ...(acepta ? S.checkboxActivo : {}) }}>{acepta ? "✓" : ""}</div>
        <div style={S.textoCheckbox}>Acepto los términos de la red y autorizo la verificación de mis datos.</div>
      </div>

      <button
        style={{ ...S.botonRegistro, opacity: completo ? 1 : 0.35 }}
        disabled={!completo}
        onClick={() => onRegistrado({ nombre, ciudad })}
      >
        Enviar registro
      </button>
    </div>
  );
}

function AppBarista() {
  const [tab, setTab] = useState("capacitarte");
  return (
    <React.Fragment>
      <div style={S.contenido}>
        {tab === "capacitarte" && <PantallaCapacitarte />}
        {tab === "ingresos" && <PantallaIngresos />}
      </div>
      <div style={S.tabBar}>
        {TABS_BARISTA.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.tabBtn, opacity: tab === t.id ? 1 : 0.4 }}>
            <div style={S.tabNum}>{t.n}</div>
            <div style={S.tabTitulo}>{t.titulo}</div>
            {tab === t.id && <div style={S.tabIndicador} />}
          </button>
        ))}
      </div>
    </React.Fragment>
  );
}
function App() {
  const [perfil, setPerfil] = useState(null); // null | "cafeteria" | "barista"
  const [baristaRegistrado, setBaristaRegistrado] = useState(false);

  return (
    <div style={S.escenario}>
      <div style={S.telefono}>
        <div style={S.notch} />
        <div style={S.barraEstado}>
          <span>9:41</span>
          <span style={{ display: "flex", gap: 5, alignItems: "center" }}>
            <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="7" width="3" height="4" fill={INK}/><rect x="4.5" y="5" width="3" height="6" fill={INK}/><rect x="9" y="2.5" width="3" height="8.5" fill={INK}/><rect x="13.5" y="0" width="2.5" height="11" fill={INK}/></svg>
            <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0.5" y="0.5" width="15" height="10" rx="2" fill="none" stroke={INK}/><rect x="16.3" y="3.5" width="1.3" height="4" fill={INK}/><rect x="2" y="2" width="11" height="7" fill={INK}/></svg>
          </span>
        </div>

        <div style={S.marcaApp}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={S.marcaTexto}>PULSO·CAFÉ</div>
              <div style={S.marcaSub}>
                {perfil === "barista" ? "PERFIL BARISTA" : perfil === "cafeteria" ? "PERFIL CAFETERÍA" : "SALUD OPERATIVA — CAFETERÍAS INDEPENDIENTES"}
              </div>
            </div>
            {perfil && (
              <button style={S.cambiarPerfil} onClick={() => setPerfil(null)}>← cambiar</button>
            )}
          </div>
        </div>

        {perfil === null && <div style={S.contenido}><PantallaLanding onElegir={setPerfil} /></div>}
        {perfil === "cafeteria" && <AppCafeteria />}
        {perfil === "barista" && !baristaRegistrado && (
          <div style={S.contenido}>
            <PantallaRegistroBarista onRegistrado={() => setBaristaRegistrado(true)} />
          </div>
        )}
        {perfil === "barista" && baristaRegistrado && <AppBarista />}

        <div style={S.homeIndicator} />
      </div>
      <div style={S.notaPie}>Vista previa · dimensiones de referencia iPhone / Android</div>
    </div>
  );
}
